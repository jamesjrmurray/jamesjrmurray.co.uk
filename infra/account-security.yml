AWSTemplateFormatVersion: '2010-09-09'
Description: Account-wide security for jamesjrmurray.co.uk (activity log, access checker, threat detection)

Parameters:
  LogRetentionDays:
    Type: Number
    Default: 365

Resources:
  # Permanent record of every change made in the account (CloudTrail keeps only 90 days on its own).
  TrailBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub jm-cloudtrail-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: expire-logs
            Status: Enabled
            ExpirationInDays: !Ref LogRetentionDays

  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudTrailAclCheck
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/jm-account-trail
          - Sid: CloudTrailWrite
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub ${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceArn: !Sub arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/jm-account-trail
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt TrailBucket.Arn, !Sub '${TrailBucket.Arn}/*']
            Condition:
              Bool: { aws:SecureTransport: 'false' }

  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Properties:
      TrailName: jm-account-trail
      S3BucketName: !Ref TrailBucket
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true

  # Flags anything (bucket, role, key) shared outside this account. Free.
  AccessAnalyzer:
    Type: AWS::AccessAnalyzer::Analyzer
    Properties:
      AnalyzerName: jm-account-analyzer
      Type: ACCOUNT

  # Threat detection for the region the site runs in. Extras that don't apply to a static site are off.
  GuardDuty:
    Type: AWS::GuardDuty::Detector
    Properties:
      Enable: true
      FindingPublishingFrequency: SIX_HOURS
      Features:
        - { Name: S3_DATA_EVENTS, Status: ENABLED }
        - { Name: EKS_AUDIT_LOGS, Status: DISABLED }
        - { Name: EBS_MALWARE_PROTECTION, Status: DISABLED }
        - { Name: RDS_LOGIN_EVENTS, Status: DISABLED }
        - { Name: LAMBDA_NETWORK_LOGS, Status: DISABLED }
        - { Name: RUNTIME_MONITORING, Status: DISABLED }

Outputs:
  TrailBucketName: { Value: !Ref TrailBucket }
  GuardDutyDetectorId: { Value: !Ref GuardDuty }
