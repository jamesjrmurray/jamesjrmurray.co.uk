<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; width: 1200px; height: 630px; background: #FAF7F2; font-family: "Instrument Sans", sans-serif; color: #22201C; }
  .wrap { box-sizing: border-box; height: 100%; padding: 80px 88px; display: flex; flex-direction: column; justify-content: space-between; }
  .top { display: flex; align-items: center; gap: 18px; font-size: 26px; font-weight: 500; }
  .mono { position: relative; width: 64px; height: 64px; border-radius: 50%; background: #0B2545; color: #FAF7F2; display: flex; align-items: center; justify-content: center; font: 600 30px Fraunces, serif; }
  h1 { margin: 0; font: 500 76px/1.05 Fraunces, serif; color: #0B2545; letter-spacing: -0.015em; }
  em { color: #D7263D; }
  .foot { font-size: 24px; color: #6E695F; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="mono">J</div>James Murray</div>
  <h1>Engineer’s instinct.<br><em>Product thinker’s questions.</em></h1>
  <div class="foot">Product leader for AI and data · jamesjrmurray.co.uk</div>
</div>
</body>
</html>
